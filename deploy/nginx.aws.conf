events {}

http {
    include /etc/nginx/mime.types;

    upstream api_gateway { server api-gateway:8080; }
    upstream agent_hub { server agent-hub:8092; }
    upstream keycloak { server keycloak:8080; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        client_max_body_size 200m;

        # certbot on the host issues this with --cert-name pulse
        ssl_certificate     /etc/letsencrypt/live/pulse/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pulse/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;

        location /auth/admin {
            return 403;
        }

        location /auth/ {
            proxy_pass http://keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_http_version 1.1;
        }

        location /ws/ {
            proxy_pass http://agent_hub;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        location /api/files/ {
            proxy_pass http://agent_hub;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 5m;
            proxy_send_timeout 5m;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location ~* /api/.*/stream$ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
        }

        location /install/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }

        # react router handles everything else
        location / {
            try_files $uri /index.html;
        }
    }
}

# TCP passthrough so TLS goes end-to-end between agent and agent-hub
stream {
    server {
        listen 9090;
        proxy_pass agent-hub:9090;
    }
}
